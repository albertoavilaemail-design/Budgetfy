<script>try{document.documentElement.dataset.theme=localStorage.getItem('budgetfy_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
  :root{--bg:#f8f9fa;--text:#212529;--primary:#2ecc71;--secondary:#3498db;--card:#fff;--danger:#e74c3c;--muted:#66707a;--line:#ccd1d5;--soft:#f4f6f7;--track:#e0e0e0;--head:#2c3e50;--label:#555;--ok:#1e8e4f}
  :root[data-theme=dark]{--bg:#12161a;--text:#e6e9ec;--card:#1c2228;--muted:#9aa5ae;--line:#37424b;--soft:#252d34;--track:#38434c;--head:#e8eef2;--label:#b6c0c8;--ok:#4cd787;color-scheme:dark}
  textarea{min-height:70px;resize:vertical}
  #warn{background:var(--soft);border:2px solid var(--danger);color:var(--danger);padding:12px 16px;border-radius:8px;margin-bottom:18px;font-weight:600}
  #warn[hidden]{display:none}
  .tl{stroke:var(--track)}.tt{fill:var(--head)}.tm{fill:var(--muted)}
  .pbar{position:relative;background:var(--track);height:10px;border-radius:6px;margin-top:8px}
  .pbar i{display:block;height:100%;border-radius:6px;transition:width .4s}
  .pbar b{position:absolute;top:-4px;width:2px;height:18px;background:var(--head)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.5}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.05)}
  .logo{font-weight:bold;font-size:1.5rem;color:var(--primary)}
  .lang-btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:1rem}
  main{max-width:960px;margin:0 auto;padding:24px 5% 60px}
  .box{background:var(--card);border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.05);padding:26px;margin-bottom:24px}
  .meter-box{text-align:center}
  .meter-box h2,.box h2{margin:0 0 4px;color:var(--head)}
  .box h3{margin:26px 0 10px;color:var(--head)}
  .meter-bg{background:var(--track);border-radius:10px;height:25px;margin:18px 0;overflow:hidden}
  .meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--secondary),var(--primary));transition:width .6s ease}
  .score-val{font-size:2rem;font-weight:bold;color:var(--primary)}
  .status{font-size:1.05rem;color:var(--head);font-weight:600}
  .muted{color:var(--muted);font-size:.88rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  label{font-size:.9rem;color:var(--label);display:block}
  input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;font:inherit;margin-top:4px;background:var(--card);color:var(--text)}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{text-align:left;font-size:.85rem;color:var(--muted);padding:4px}
  td{padding:4px}
  tfoot td{font-weight:bold;padding-top:10px}
  .btn{background:var(--secondary);color:#fff;border:none;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:bold;margin:8px 8px 0 0;font-size:.95rem}
  .btn{transition:filter .15s,background .15s,border-color .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:7px 13px}
  .btn.ghost:hover{background:var(--soft);filter:none}
  .btn.go{background:var(--primary)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:7px 13px}
  .btn.danger:hover{background:var(--danger);color:#fff;filter:none}
  td .btn.ghost{border-color:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:6px 9px!important}
  td .btn.ghost:hover{color:var(--danger);background:var(--soft)}
  .over{color:var(--danger);font-weight:bold}.ok{color:var(--ok);font-weight:bold}
  .pane > h3{border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
  .pane > h3:first-child{border-top:0;padding-top:0;margin-top:4px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:14px;scrollbar-width:none}
  .tabs button{flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-size:.92rem;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--head);color:var(--bg);border-color:var(--head);font-weight:600}
  .setup-list{display:grid;gap:8px;margin-top:8px}
  .setup-list > div{display:grid;grid-template-columns:28px 1fr 130px 120px;gap:10px;align-items:center}
  .setup-list .tag{font-size:.8rem;color:var(--muted)}
  .imp{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
  .imp td,.imp th{padding:6px;border-bottom:1px solid var(--line);font-size:.9rem}
  .imp th{position:sticky;top:0;background:var(--card)}
  .num{font-variant-numeric:tabular-nums}
  .txl{list-style:none;margin:14px 0 0;padding:0}
  .txl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .txm{flex:1;min-width:0;display:flex;flex-direction:column}
  .txm span{font-size:.82rem;overflow-wrap:anywhere}
  .txa{font-weight:600}
  .txb{display:flex;white-space:nowrap}
  .txb .btn{margin:0;border-color:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:6px 9px}
  .txb .btn:hover{color:var(--danger);background:var(--soft)}
  .exbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:.92rem}
  .exbar .btn{margin:0}
  footer{max-width:960px;margin:0 auto;padding:0 5% 40px;text-align:center;font-size:.85rem;color:var(--muted)}
  @media(max-width:600px){.setup-list > div{grid-template-columns:28px 1fr 100px}.setup-list .tag{display:none}}
  .box h3{font-size:1.1rem}
  #ws table select{min-width:140px}
  .summary b{color:var(--head)}
  nav .icon-btn{background:transparent;border:1px solid var(--line);color:var(--text);padding:7px 11px}
  .modal{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal>div{background:var(--card);color:var(--text);border-radius:10px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .modal p{margin:0 0 14px}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px)}
  .score-val.mid{color:#e6a23c}.score-val.low{color:var(--danger)}
  .dim{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
  .dim .bar{background:var(--track);border-radius:8px;height:12px;overflow:hidden}
  .dim .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--secondary),var(--primary))}
  .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
  .ins div{background:var(--soft);border-radius:8px;padding:14px;font-size:.92rem;text-align:left}
  .ins ul{margin:6px 0 0;padding-left:18px}.ins p{margin:6px 0 0}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px}
  .summary div{background:var(--soft);border-radius:8px;padding:12px;text-align:center}
  .summary b{display:block;font-size:1.25rem}
  .summary span{font-size:.8rem;color:var(--muted)}
  .hist{margin-top:10px;font-size:.88rem;color:var(--label)}
  .trend{width:100%;height:auto;margin:6px 0}
  .hist-tbl td,.hist-tbl th{padding:6px 4px;border-bottom:1px solid var(--line)}
  .hist-tbl{min-width:420px}
  @media(max-width:600px){.dim{grid-template-columns:110px 1fr 34px}.box{padding:18px}main{padding:16px 12px 48px}.grid{grid-template-columns:1fr 1fr}.score-val{font-size:1.7rem}}
</style>
</head>

  <div><button class="lang-btn icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" style="margin-right:8px">🌙</button><button class="lang-btn" id="langToggle" onclick="changeLanguage()">Español</button></div>

<script>
let lang = 'en';
const $ = id => document.getElementById(id);
const esc = x => String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fmt = n => Math.round(n).toLocaleString();
let toastT;
function note(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 3500); }
function ask(msg, okLabel){
  return new Promise(res=>{
    const m = $('modal'), ok = $('modalOk'), no = $('modalNo');
    $('modalMsg').textContent = msg; ok.textContent = okLabel || (lang==='es' ? 'Continuar' : 'Continue'); no.textContent = lang==='es' ? 'Cancelar' : 'Cancel';
    m.hidden = false; ok.focus();
    const done = v => { m.hidden = true; ok.onclick = no.onclick = null; res(v); };
    ok.onclick = () => done(true); no.onclick = () => done(false);
  });
}
async function saveFile(filename, data){
  try{
    const d = window.claude && await window.claude.use('downloads');
    if(d){ await d.save({filename, data}); return true; }
  }catch(e){ if(e && e.code === 'declined') return false; }
  try{
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); return true;
  }catch(e){ note(lang==='es' ? 'No se pudo guardar el archivo aquí.' : 'Could not save the file here.'); return false; }
}

function curMonth(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function nextMonth(m){ let [y,mo] = m.split('-').map(Number); mo++; if(mo>12){ mo=1; y++; } return y + '-' + String(mo).padStart(2,'0'); }
function monthLabel(m){ const [y,mo] = m.split('-'); return new Date(+y, +mo-1, 1).toLocaleDateString(lang==='es'?'es':'en-US', {month:'short', year:'numeric'}); }
function normalize(){
  delete S.done;
  if(!/^\d{4}-\d{2}$/.test(S.month||'')) S.month = curMonth();
  if(!S.incM || typeof S.incM !== 'object') S.incM = {};
  if(!S.map || typeof S.map !== 'object') S.map = {};
  ['rows','checks','tx','goals','bills','debts','rec','history'].forEach(k=>{ if(!Array.isArray(S[k])) S[k] = []; });
  S.rows.forEach(r=>{ if(!r.id) r.id = uid(); });
  // bills and recurring now live in one list
  S.bills.forEach(b=>S.rec.push({id:uid(), n:b.n||'', r:'', a:+b.a||0, d:+b.d||1, auto:0, last:b.paid===S.month ? S.month : '', skip:'', txid:''}));
  delete S.bills;
  S.rec.forEach(x=>{ if(!x.id) x.id = uid(); if(x.auto === undefined) x.auto = x.r ? 1 : 0; if(x.r && !S.rows.some(r=>r.id===x.r)) x.r = ''; });
  S.goals.forEach(g=>{ if(g.r === undefined) g.r = ''; });
  // "Spent so far" always comes from logged spending; older typed-in amounts become a starting entry
  S.rows.forEach(r=>{
    const sum = S.tx.filter(t=>t.r===r.id).reduce((a,t)=>a+(+t.a||0),0), typed = +r.s||0;
    if(typed > sum + .005) S.tx.unshift({id:uid(), r:r.id, c:r.n||'', a:Math.round((typed-sum)*100)/100, d:S.month+'-01', n:lang==='es'?'Monto inicial':'Starting amount'});
    r.s = Math.max(sum, typed);
  });
}

function trendHtml(){
  const w = W[lang], H = S.history;
  if(H.length < 2) return `<p class="muted">${w.trendNone}</p>`;
  const Wd = 600, Ht = 160, pad = 28, step = (Wd - 2*pad)/(H.length - 1);
  const pts = H.map((h,i)=>[pad + i*step, pad + (100 - (h.score||0))/100*(Ht - 2*pad)]);
  return `<svg class="trend" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${w.hist}">
    <line class="tl" x1="${pad}" y1="${pad}" x2="${Wd-pad}" y2="${pad}"/><line class="tl" x1="${pad}" y1="${Ht-pad}" x2="${Wd-pad}" y2="${Ht-pad}"/>

function updExtras(){
  const w = W[lang], pe = $('pace'); updMore(w);
  if(pe){
    const tp = S.rows.reduce((a,r)=>a+P(r),0), ts = S.rows.reduce((a,r)=>a+(+r.s||0),0);
    if(!tp) pe.innerHTML = '';
    else {
      const [y,mo] = S.month.split('-').map(Number), tot = new Date(y,mo,0).getDate(), cm = curMonth();
      const day = S.month===cm ? new Date().getDate() : (S.month<cm ? tot : 0), el = Math.round(day/tot*100), sp = Math.round(ts/tp*100), hi = sp > el + 10;
      pe.innerHTML = `<p class="${hi?'over':'ok'}" style="margin:14px 0 0">${hi?w.paceHi:w.paceOk} · <span class="muted" style="font-weight:normal">${w.pace(day,tot,el,sp)}</span></p>
        <div class="pbar"><i style="width:${Math.min(sp,100)}%;background:${hi?'var(--danger)':'var(--primary)'}"></i><b style="left:${el}%"></b></div>`;
    }
  }
  S.goals.forEach((g,i)=>{ const b = $('gb'+i); if(b){ const sv = goalSaved(g), p = g.t>0 ? Math.min(100, Math.round(sv/g.t*100)) : 0; b.style.width = p+'%'; $('gp'+i).textContent = w.gOf(fmt(sv), fmt(g.t||0)) + ' · ' + p + '%'; } });
  const du = $('due');
  if(du){
    const n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()), L = [];
    const dim = (y,m) => new Date(y, m+1, 0).getDate();
    const cm = curMonth();
    S.rec.forEach(b=>{
      const d = +b.d; if(!(d>=1 && d<=31)) return;
      const paid = b.last === S.month;
      let c = new Date(t0.getFullYear(), t0.getMonth(), Math.min(d, dim(t0.getFullYear(), t0.getMonth())));
      if(c < t0){
        const late = Math.round((t0 - c)/864e5);
        if(!paid && late <= 7){ L.push([-late, b]); return; }
        c = new Date(t0.getFullYear(), t0.getMonth()+1, Math.min(d, dim(t0.getFullYear(), t0.getMonth()+1)));
      } else if(paid) return;
      const k = Math.round((c - t0)/864e5); if(k <= 7) L.push([k,b]);
    });
    L.sort((a,b)=>a[0]-b[0]);
    du.innerHTML = `<strong>${w.due}</strong>` + (L.length ? `<ul>${L.map(([k,b])=>`<li${k<0 ? ' class="over"' : ''}>${esc(b.n||'?')} · $${fmt(b.a)} · ${k<0?w.odue(-k):k===0?w.d0:k===1?w.d1:w.dn(k)}</li>`).join('')}</ul>` : `<p class="muted" style="margin:4px 0 0">${w.dueNone}</p>`);
  }
}

function parseCsv(text){
  const out = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ',' || c === ';' || c === '\t'){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); out.push(row); }
  return out;
}
function toIso(v){
  v = String(v||'').trim(); const pad = n => String(n).padStart(2,'0'); let m;
  if((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  if((m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ let y = +m[3]; if(y < 100) y += 2000; return y + '-' + pad(m[1]) + '-' + pad(m[2]); }
  return '';
}
function money(v){
  v = String(v||'').trim(); if(!v) return NaN;
  const neg = /^\(.*\)$/.test(v) || /^-/.test(v.replace(/[$\s]/g,'')) || /-$/.test(v);
  const n = parseFloat(v.replace(/[^0-9.]/g,''));
  return isNaN(n) ? NaN : (neg ? -n : n);
}
function mkey(desc){ return String(desc).toLowerCase().replace(/[^a-zà-ÿ\s]/g,' ').split(/\s+/).filter(x=>x.length > 2).slice(0,2).join(' '); }
function guessCat(desc){
  const k = mkey(desc);
  if(k && S.map[k]){ const i = S.rows.findIndex(r=>r.id===S.map[k]); if(i >= 0) return i; }
  const dl = String(desc).toLowerCase();
  return S.rows.findIndex(r=>r.n && r.n.length > 2 && dl.includes(r.n.toLowerCase()));
}
function importCsv(ev){
  const f = ev.target.files[0]; ev.target.value = ''; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const w = W[lang], rows = parseCsv(String(rd.result).replace(/^﻿/,''));
    const hi = rows.findIndex(r=>r.some(c=>/date|fecha/i.test(c)));
    if(hi < 0){ note(w.impNone); return; }
    const H = rows[hi].map(c=>c.trim().toLowerCase()), col = re => H.findIndex(c=>re.test(c));
    const di = col(/date|fecha/), dsc = col(/desc|payee|merchant|memo|name|details|concepto|detalle/), am = col(/amount|monto|importe/),
      db = col(/debit|withdraw|cargo|retiro/);
    if(di < 0 || (am < 0 && db < 0)){ note(w.impNone); return; }
    let L = [];
    rows.slice(hi+1).forEach(r=>{
      const d = toIso(r[di]); if(!d) return;
      const desc = (dsc >= 0 ? r[dsc] : '').trim();
      const a = db >= 0 ? money(r[db]) : money(r[am]);
      if(isNaN(a) || !a) return;
      L.push({d, desc, a});
    });
    if(db < 0 && L.some(l=>l.a < 0)) L = L.filter(l=>l.a < 0);
    L.forEach(l=>{ l.a = Math.round(Math.abs(l.a)*100)/100; });
    const seen = t => S.tx.some(x=>x.d===t.d && Math.abs(x.a - t.a) < .005 && (x.n||'') === t.desc);
    const dup = L.filter(seen).length; L = L.filter(l=>!seen(l));
    if(!L.length){ note(dup ? w.impDup(dup) : w.impNone); return; }
    if(dup) note(w.impDup(dup));
    imp = L.map(l=>Object.assign(l, {ci:guessCat(l.desc), on:true}));
    renderForm();
  };
  rd.readAsText(f);
}

// ===== SCORING =====
function calc(){
  const inc = effInc(), R = S.rows, sum = f => R.reduce((a,r) => a + (f(r)||0), 0);
  if(!inc || !R.length) return null;
  const pl = sum(r=>+r.p), must = sum(r=>r.k==='m' ? +r.p : 0), sav = sum(r=>r.k==='s' ? +r.p : 0);
  const over = R.filter(r=>+r.s > P(r)).map(r=>({n:r.n||'?', d:r.s-P(r)})).sort((a,b)=>b.d-a.d);
  const cl = x => Math.max(0, Math.min(100, x)), ch = S.checks.slice(-4);
  const cons = ch.length ? ch.reduce((a,c)=>a + ({y:100,m:65,n:25})[c.f], 0)/ch.length : 60;
  const d = {
    ess: cl(100 - Math.max(0, must/inc - .8)*500),
    bal: pl/inc <= 1 ? 100 : cl(100 - (pl/inc - 1)*250),
    sav: sav > 0 ? cl(50 + sav/inc/.1*50) : 0,
    flex: cl(100 - over.reduce((a,o)=>a+o.d,0)/Math.max(pl,1)*500),
    cush: must ? cl((mo => mo <= 1 ? mo*60 : 60 + (mo-1)/2*40)(S.cushion/must)) : 0,
    stab: cl((S.low || inc)/inc*100),
    cons
  };
  const wt = {ess:.2,bal:.2,sav:.15,flex:.1,cush:.15,stab:.1,cons:.1};
  return {inc, pl, must, sav, over, d, ch, score:Math.round(Object.keys(wt).reduce((a,k)=>a + d[k]*wt[k], 0))};
}
function insights(m){
  const w = W[lang], d = m.d, g = [], a = [], c = S.checks;
  if(d.ess>=75) g.push(w.g[0]); if(d.sav>=75) g.push(w.g[1]); if(d.bal>=95) g.push(w.g[2]); if(d.flex>=80) g.push(w.g[3]); if(d.cons>=80 && c.length) g.push(w.g[4]);
  if(d.ess<60) a.push(w.a[0](Math.round(m.must/m.inc*100)));
  if(m.pl>m.inc) a.push(w.a[1](fmt(m.pl-m.inc)));
  if(d.sav<50) a.push(w.a[2](Math.round(m.sav/m.inc*100)));
  if(m.over[0]) a.push(w.a[3](esc(m.over[0].n), fmt(m.over[0].d)));
  if(d.cush<60) a.push(w.a[4]((S.cushion/(m.must||1)).toFixed(1)));
  if(c.length && c[c.length-1].u > S.cushion) a.push(w.a[5](fmt(c[c.length-1].u)));
  if(c.length>1 && c.slice(-2).every(x=>x.e==='d')) a.push(w.a[6]());
  if(d.stab<75) a.push(w.a[7]());
  if(!c.length) a.push(w.a[8]());
  return {g, a};
}

// update(): recalculates meter, totals and insights without rebuilding inputs (keeps focus while typing)

  $('mScore').textContent = m ? m.score + '/100' : '—';
  $('mScore').className = 'score-val' + (m ? (m.score>=75 ? '' : m.score>=55 ? ' mid' : ' low') : '');
  $('mStatus').textContent = m ? (m.score>=75 ? w.st[0] : m.score>=55 ? w.st[1] : w.st[2]) : '';

  let res = `<p class="muted" style="text-align:center">${w.empty}</p>`;
  if(m){
    const I = insights(m);
    res = Object.keys(w.dims).map(k=>`<div class="dim"><span>${w.dims[k]}</span><span class="bar"><i style="width:${Math.round(m.d[k])}%"></i></span><span>${Math.round(m.d[k])}</span></div>`).join('') +
      `<div class="ins"><div><strong>${w.good}</strong><ul>${I.g.map(x=>`<li>${x}</li>`).join('') || '<li>—</li>'}</ul></div>
       <div><strong>${w.attn}</strong><ul>${I.a.map(x=>`<li>${x}</li>`).join('') || '<li>—</li>'}</ul></div>
       <div><strong>${w.focus}</strong><p>${I.a[0] || w.keep}</p></div></div>`;
  }
  $('results').innerHTML = res;

  // per-row "left" and totals
  S.rows.forEach((r,i)=>{
    const el = $('left'+i); if(!el) return;
    const l = P(r) - (+r.s||0);
    el.textContent = (l<0 ? '-' : '') + '$' + fmt(Math.abs(l));
    el.className = 'num ' + (l<0 ? 'over' : 'ok');
    const sp = $('sp'+i); if(sp) sp.textContent = '$' + fmt(+r.s||0);
  });
  const tp = S.rows.reduce((a,r)=>a+(+r.p||0),0), ts = S.rows.reduce((a,r)=>a+(+r.s||0),0), inc = effInc();
  if($('totP')){ $('totP').textContent = '$'+fmt(tp); $('totS').textContent = '$'+fmt(ts); }
  if($('sumBox')){
    const un = inc - tp;
    $('sumBox').innerHTML = [[w.sum[0],inc],[w.sum[1],tp],[w.sum[2],ts],[w.sum[3],un]]
      .map(([l,v],i)=>`<div><b${i===3&&v<0?' class="over"':''}>${v<0?'-':''}$${fmt(Math.abs(v))}</b><span>${l}</span></div>`).join('');
  }
}

  }
  $('tabs').hidden = false; $('meterBox').hidden = false; $('meterBox').dataset.tab = 'ov';
  $('tabs').innerHTML = TABS.map((t,i)=>`<button role="tab" data-t="${t}" onclick="setTab('${t}')">${w.tabs[i]}</button>`).join('');

  const opt = (arr,v) => arr.map((x,i)=>`<option value="${'mins'[i]}"${v==='mins'[i]?' selected':''}>${x}</option>`).join('');
  const rows = S.rows.map((r,i)=>`<tr>
    <td><input id="cn${i}" value="${esc(r.n)}" placeholder="${w.newCat}" oninput="setRow(${i},'n',this.value)"></td>
    <td><input id="cp${i}" type="number" min="0" inputmode="decimal" value="${r.p||''}" oninput="setRow(${i},'p',this.value)">${r.c>0 ? `<small class="muted">+$${fmt(r.c)} ${w.carried}</small>` : ''}</td>
    <td class="num" id="sp${i}"></td>
    <td class="num" id="left${i}"></td>
    <td><select id="ck${i}" onchange="setRow(${i},'k',this.value)">${opt(w.pris,r.k)}</select></td>
    <td style="text-align:center"><input type="checkbox" style="width:auto;margin:0" ${r.ro ? 'checked' : ''} onchange="setRow(${i},'ro',this.checked ? 1 : 0)" aria-label="${w.roL}"></td>
    <td><button class="btn ghost" onclick="delRow(${i})" aria-label="Delete">&times;</button></td></tr>`).join('');
  const last = S.checks.slice(-3).reverse().map(c=>`${w.feels['eod'.indexOf(c.e)]||'—'} / ${w.fols['ymn'.indexOf(c.f)]||'—'}${c.u?' / $'+fmt(c.u):''}`).join(' &nbsp;·&nbsp; ');

  $('ws').innerHTML = `
  <div class="pane" data-tab="ov">
   ${S.preEx ? `<div class="exbar"><span>${w.exOn}</span><button class="btn danger" onclick="clearEx()">${w.exClear}</button></div>` : ''}
   <h2>${w.title} · ${monthLabel(S.month)}</h2><p class="muted">${w.sub}</p>
   <div class="summary" id="sumBox"></div><div id="pace"></div>
   ${txHtml()}
   <button class="btn ghost" onclick="$('impFile').click()">${w.imp}</button>
   <input type="file" id="impFile" accept=".csv,text/csv" hidden onchange="importCsv(event)">
   ${impHtml()}
   <h3>${w.ccT}</h3><div id="catChart"></div>
  </div>

  <div class="pane" data-tab="bud">
   <h3>${w.title} · ${monthLabel(S.month)}</h3>
   <div class="grid">
     <label>${w.inc}<input id="fInc" type="number" min="0" inputmode="decimal" value="${S.income||''}" oninput="setF('income',this.value)"></label>
     <label>${w.incM(monthLabel(S.month))}<input id="fIncM" type="number" min="0" inputmode="decimal" placeholder="${fmt(+S.income||0)}" value="${S.incM && S.incM[S.month] != null ? S.incM[S.month] : ''}" oninput="setIncM(this.value)">${avgInc() ? `<small class="muted">${w.avgInc(fmt(avgInc()))} <a href="#" onclick="useAvg();return false">${w.useIt}</a></small>` : ''}</label>
     <label>${w.low}<input id="fLow" type="number" min="0" inputmode="decimal" value="${S.low||''}" oninput="setF('low',this.value)"></label>
     <label>${w.cush}<input id="fCush" type="number" min="0" inputmode="decimal" value="${S.cushion||''}" oninput="setF('cushion',this.value)"></label>
   </div>
   <h3>${w.exp}</h3><p class="muted" style="margin-top:0">${w.spentHint}</p>
   <div class="tbl"><table>
     <thead><tr><th>${w.name}</th><th>${w.plan}</th><th>${w.spent}</th><th>${w.left}</th><th>${w.pri}</th><th>${w.roL}</th><th></th></tr></thead>
     <tbody>${rows}</tbody>
     <tfoot><tr><td>${w.total}</td><td class="num" id="totP"></td><td class="num" id="totS"></td><td></td><td></td><td></td><td></td></tr></tfoot>
   </table></div>
   <button class="btn" onclick="addRow()">${w.add}</button><button class="btn go" onclick="newMonth()">${w.newMonth}</button>${S.undo ? `<button class="btn ghost" onclick="undoClose()">${w.undoL(monthLabel(undoMonth()))}</button>` : ''}
   <label style="margin-top:14px">${w.noteL}<textarea id="fNote" oninput="setNote(this.value)">${esc(S.note)}</textarea></label>
  </div>

  <div class="pane" data-tab="plan">
   ${recHtml()}${goalsHtml()}${debtsHtml()}
  </div>

  <div class="pane" data-tab="hist">
   <h3>${w.ck}</h3>
   <div class="grid">
     <label>${w.feel}<select id="cke"><option value="e">${w.feels[0]}</option><option value="o">${w.feels[1]}</option><option value="d">${w.feels[2]}</option></select></label>
     <label>${w.fol}<select id="ckf"><option value="y">${w.fols[0]}</option><option value="m">${w.fols[1]}</option><option value="n">${w.fols[2]}</option></select></label>
     <label>${w.un}<input id="cku" type="number" min="0" inputmode="decimal"></label>
   </div>
   <button class="btn" onclick="addCheck()">${w.log}</button>${S.checks.length?`<button class="btn ghost" onclick="undoCheck()">${w.undoCk}</button>`:''}
   <span class="muted">${S.checks.length} ${w.ckn}</span>
   ${last ? `<div class="hist">${w.recent} ${last}</div>` : ''}
   <h3>${w.hist}</h3>${trendHtml()}
   ${S.history.length ? `<div class="tbl"><table class="hist-tbl"><thead><tr>${w.hm.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${S.history.map((h,i)=>`<tr><td>${monthLabel(h.m)}</td><td class="num">${h.score}</td><td class="num">$${fmt(h.inc)}</td><td class="num">$${fmt(h.pl)}</td><td class="num">$${fmt(h.sp)}</td><td style="font-size:.85rem;max-width:240px">${esc(h.note||'')}</td><td><button class="btn ghost" onclick="delHist(${i})" aria-label="Delete">&times;</button></td></tr>`).join('')}</tbody></table></div>` : ''}
   <h3>${w.dataT}</h3>
   <p class="muted" style="margin-top:0">${w.autosave}<br><strong>${S.lastBackup ? w.lastBk(S.lastBackup) : w.noBk}</strong></p>
   <button class="btn ghost" onclick="exportData()">${w.backup}</button><button class="btn ghost" onclick="exportCsv()">${w.csv}</button><button class="btn ghost" onclick="$('restoreFile').click()">${w.restore}</button>${S.preEx ? `<button class="btn ghost" onclick="clearEx()">${w.exClear}</button>` : `<button class="btn ghost" onclick="loadEx()">${w.ex}</button>`}<button class="btn danger" onclick="resetAll()">${w.reset}</button>
   <input type="file" id="restoreFile" accept="application/json,.json" hidden onchange="importData(event)">
  </div>`;
  showTab();
  update();
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('modal').hidden) $('modalNo').click(); });
load(); runRecurring(); setThemeBtn(); makeIcon(); renderForm();
</script>

</body>
</html>
